services:
  www:
    image: nginx:1.27-alpine
    container_name: wenshu-www-static
    restart: unless-stopped
    volumes:
      - /opt/wenshu-site:/srv/wenshu:ro
      - /opt/wenshu-site/nginx.static.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - icp

networks:
  icp:
    external: true
    name: xt-mvp-icp_default
